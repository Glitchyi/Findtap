<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FindTap Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f6f8fa;
      padding: 32px;
      min-width: 420px;
      color: #1a1a2e;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
    .card {
      background: white;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #555; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; align-items: center; gap: 12px; }
    label { font-size: 14px; flex: 1; }
    input[type="number"] {
      width: 64px; padding: 6px 10px; font-size: 14px;
      border: 1px solid #d0d7de; border-radius: 6px; outline: none;
    }
    input[type="number"]:focus { border-color: #89b4fa; box-shadow: 0 0 0 3px rgba(137,180,250,.2); }
    .btn {
      padding: 6px 16px; font-size: 14px; font-weight: 500; cursor: pointer;
      border: 1px solid #d0d7de; border-radius: 6px; background: white;
    }
    .btn-primary { background: #1a73e8; color: white; border-color: #1a73e8; }
    .btn-primary:hover { background: #1558b0; }
    #status { font-size: 13px; color: #2da44e; min-height: 18px; margin-top: 10px; }
    .shortcut-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .shortcut-label { font-size: 14px; flex: 1; }
    kbd {
      background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px;
      padding: 3px 8px; font-family: monospace; font-size: 13px;
      box-shadow: 0 1px 0 #adb3bc;
    }
    .hint { font-size: 12px; color: #777; margin-top: 8px; line-height: 1.5; }
    .btn-shortcut {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
      border: 1px solid #d0d7de; border-radius: 6px; background: white;
      color: #1a73e8; text-decoration: none; margin-top: 10px;
      transition: background .15s, border-color .15s;
    }
    .btn-shortcut:hover { background: #f0f6ff; border-color: #89b4fa; }
    .btn-shortcut svg { flex-shrink: 0; }
    /* Toggle */
    .toggle-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
    .toggle-row label { font-size: 14px; flex: 1; cursor: pointer; }
    .toggle {
      position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; background: #d1d5db; border-radius: 22px;
      cursor: pointer; transition: background .2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute;
      width: 16px; height: 16px; left: 3px; bottom: 3px;
      background: white; border-radius: 50%; transition: transform .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .toggle input:checked + .toggle-slider { background: #1a73e8; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }
  </style>
</head>
<body>
  <h1>FindTap Settings</h1>

  <div class="card">
    <h2>Keyboard Shortcut</h2>
    <div class="shortcut-row">
      <span class="shortcut-label">Toggle palette</span>
      <kbd id="shortcut-display">Loading…</kbd>
    </div>
    <button id="shortcuts-btn" class="btn-shortcut">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Change shortcut
    </button>
  </div>

  <div class="card">
    <h2>Search</h2>
    <div class="row">
      <label for="maxResults">Max results shown (3–10)</label>
      <input id="maxResults" type="number" min="3" max="10" value="5" />
      <button id="save" class="btn btn-primary">Save</button>
    </div>
    <div class="toggle-row">
      <label for="enterSelectsFirst">Press Enter to click the top result</label>
      <label class="toggle">
        <input type="checkbox" id="enterSelectsFirst" checked />
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FindTap icon</title>
  <desc id="desc">Dark rounded square with a white F and red number one badge.</desc>
  <defs>
    <filter id="badgeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.9 0 0.18 0 0 0.25 0 0 0.18 0 0.18 0 0 0 0.55 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="surface" x1="90" y1="66" x2="422" y2="446" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#252a34"/>
      <stop offset="1" stop-color="#171a20"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="0" fill="#111317"/>
  <rect x="88" y="88" width="336" height="336" rx="62" fill="url(#surface)" stroke="#303642" stroke-width="10"/>
  <path fill="#e6e8ee" d="M178 340V156h121v39h-73v38h62v39h-62v68h-48z"/>
  <g filter="url(#badgeGlow)">
    <rect x="285" y="62" width="142" height="72" rx="28" fill="#c0392b"/>
    <text x="356" y="111" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="900" text-anchor="middle">1</text>
  </g>
</svg>

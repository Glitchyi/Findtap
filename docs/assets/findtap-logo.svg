<svg width="640" height="160" viewBox="0 0 640 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FindTap logo</title>
  <desc id="desc">FindTap icon using the creator-provided shell with wordmark.</desc>
  <defs>
    <filter id="badgeGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.9 0 0.18 0 0 0.25 0 0 0.18 0 0.18 0 0 0 0.55 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(24 16)">
    <rect x="1" y="1" width="126" height="126" rx="63" fill="#05001C" fill-opacity="0.2" stroke="#2E2E2E" stroke-width="2"/>
    <path fill="#E6E8EE" d="M36 94V35h41v13H52v13h21v13H52v20H36z"/>
    <g filter="url(#badgeGlow)">
      <rect x="72" y="14" width="42" height="24" rx="10" fill="#C0392B"/>
      <text x="93" y="32" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="900" text-anchor="middle">1</text>
    </g>
  </g>
  <text x="180" y="98" fill="#E6E8EE" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="800" letter-spacing="0">FindTap</text>
</svg>

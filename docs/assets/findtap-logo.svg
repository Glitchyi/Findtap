<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-labelledby="title desc">
  <title id="title">FindTap logo</title>
  <desc id="desc">FindTap icon with wordmark.</desc>
  <defs>
    <filter id="badgeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.9 0 0.18 0 0 0.25 0 0 0.18 0 0.18 0 0 0 0.55 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="surface" x1="40" y1="35" x2="126" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#252a34"/>
      <stop offset="1" stop-color="#171a20"/>
    </linearGradient>
  </defs>
  <rect width="640" height="160" rx="0" fill="#111317"/>
  <g>
    <rect x="38" y="41" width="80" height="80" rx="12" fill="url(#surface)" stroke="#303642" stroke-width="2"/>
    <path fill="#e6e8ee" d="M64 101V59h29v9H75v9h15v9H75v15H64z"/>
    <g filter="url(#badgeGlow)">
      <rect x="86" y="30" width="58" height="31" rx="12" fill="#c0392b"/>
      <text x="115" y="52" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="900" text-anchor="middle">1</text>
    </g>
  </g>
  <text x="150" y="95" fill="#e6e8ee" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="800" letter-spacing="0">FindTap</text>
</svg>

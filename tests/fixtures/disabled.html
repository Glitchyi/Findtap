<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Disabled Fixture</title></head>
<body>
  <button id="btn-enabled">Enabled Button</button>
  <button id="btn-disabled" disabled>Disabled Button</button>
  <input id="input-enabled" type="text" value="Enabled Input" />
  <input id="input-disabled" type="text" disabled value="Disabled Input" />
  <select id="select-enabled"><option>Enabled Select</option></select>
  <select id="select-disabled" disabled><option>Disabled Select</option></select>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindTap Promo Tiles</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111317;
      --surface: #171a20;
      --surface-raised: #1b1f27;
      --border: #303642;
      --border-strong: #3a4250;
      --text: #e6e8ee;
      --muted: #8b929f;
      --accent: #5cc8ff;
      --primary: #c0392b;
      --primary-strong: #e74c3c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .tile {
      display: none;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 24% 8%, rgba(92, 200, 255, .18), transparent 32%),
        radial-gradient(circle at 76% 90%, rgba(231, 76, 60, .14), transparent 30%),
        linear-gradient(135deg, #17212b 0%, #111317 58%, #0e1014 100%);
    }

    body[data-tile="small"] #small,
    body[data-tile="marquee"] #marquee {
      display: block;
    }

    #small {
      width: 440px;
      height: 280px;
      padding: 28px;
    }

    #marquee {
      width: 1400px;
      height: 560px;
      padding: 64px 76px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 820;
      letter-spacing: 0;
    }

    #small .brand {
      font-size: 18px;
    }

    #marquee .brand {
      font-size: 26px;
    }

    .brand img {
      display: block;
      height: auto;
    }

    #small .brand img {
      width: 44px;
    }

    #marquee .brand img {
      width: 74px;
    }

    h1 {
      margin: 0;
      letter-spacing: 0;
      color: var(--text);
    }

    #small h1 {
      width: 220px;
      margin-top: 28px;
      font-size: 28px;
      line-height: 1.08;
    }

    #marquee h1 {
      width: 680px;
      margin-top: 44px;
      font-size: 68px;
      line-height: 1.02;
    }

    .accent {
      color: var(--accent);
    }

    .mock {
      position: absolute;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 28px 84px rgba(0, 0, 0, .36);
      overflow: hidden;
    }

    #small .mock {
      right: 16px;
      bottom: 18px;
      width: 188px;
      height: 134px;
    }

    #marquee .mock {
      right: 78px;
      bottom: 62px;
      width: 570px;
      height: 382px;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 31px;
      border-bottom: 1px solid var(--border);
      padding: 0 10px;
      background: #14171d;
    }

    #marquee .bar {
      height: 42px;
      gap: 8px;
      padding: 0 14px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border-strong);
    }

    #marquee .dot {
      width: 10px;
      height: 10px;
    }

    .url {
      flex: 1;
      height: 18px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface-raised);
    }

    #marquee .url {
      height: 26px;
      border-radius: 8px;
    }

    .page {
      position: relative;
      height: calc(100% - 31px);
      background:
        linear-gradient(90deg, rgba(48, 54, 66, .44) 1px, transparent 1px),
        linear-gradient(180deg, rgba(48, 54, 66, .4) 1px, transparent 1px),
        #111317;
      background-size: 42px 42px;
    }

    #marquee .page {
      height: calc(100% - 42px);
      background-size: 72px 72px;
    }

    .palette {
      position: absolute;
      top: 16px;
      left: 50%;
      width: 145px;
      transform: translateX(-50%);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px;
      background: var(--bg);
      box-shadow: 0 15px 38px rgba(0, 0, 0, .42);
    }

    #marquee .palette {
      top: 28px;
      width: 340px;
      border-radius: 10px;
      padding: 8px;
    }

    .input {
      height: 25px;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      padding: 4px 7px;
      background: var(--surface-raised);
      font-size: 11px;
      font-weight: 750;
    }

    #marquee .input {
      height: 40px;
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 18px;
    }

    .input span {
      color: var(--muted);
    }

    .target {
      position: absolute;
      display: flex;
      align-items: center;
      min-height: 29px;
      border: 2px solid var(--primary-strong);
      border-radius: 6px;
      padding: 0 10px;
      background: rgba(231, 76, 60, .12);
      color: var(--text);
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 0 16px rgba(231, 76, 60, .24);
    }

    #marquee .target {
      min-height: 48px;
      padding: 0 18px;
      font-size: 18px;
    }

    .badge {
      position: absolute;
      top: -11px;
      left: -11px;
      min-width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      line-height: 22px;
      text-align: center;
      box-shadow: 0 0 12px rgba(231, 76, 60, .54);
    }

    #marquee .badge {
      top: -14px;
      left: -14px;
      min-width: 28px;
      height: 28px;
      font-size: 15px;
      line-height: 28px;
    }

    .privacy-row {
      position: absolute;
      left: 30px;
      bottom: 32px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    #marquee .privacy-row {
      left: 80px;
      bottom: 70px;
      font-size: 21px;
      gap: 12px;
    }

    .check {
      display: grid;
      place-items: center;
      width: 21px;
      height: 21px;
      border-radius: 6px;
      background: rgba(126, 215, 168, .18);
      color: #7ed7a8;
      font-size: 14px;
      font-weight: 900;
    }

    #marquee .check {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 20px;
    }

  </style>
</head>
<body data-tile="small">
  <section id="small" class="tile">
    <div class="brand">
      <img src="../../docs/assets/findtap-icon.svg" alt="">
      FindTap
    </div>
    <h1><span class="accent">Keyboard-speed</span> page search.</h1>
    <div class="mock">
      <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url"></span></div>
      <div class="page">
        <div class="palette"><div class="input">Search... <span>install</span></div></div>
        <div class="target" style="left:26px;bottom:24px;width:134px;"><span class="badge">1</span>Install</div>
      </div>
    </div>
    <div class="privacy-row"><span class="check">✓</span>No tracking</div>
  </section>

  <section id="marquee" class="tile">
    <div class="brand">
      <img src="../../docs/assets/findtap-icon.svg" alt="">
      FindTap
    </div>
    <h1>Find clickable page controls without reaching for the mouse.</h1>
    <div class="privacy-row"><span class="check">✓</span>Local by design. No analytics or remote code.</div>
    <div class="mock">
      <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url"></span></div>
      <div class="page">
        <div class="palette"><div class="input">Search... <span>settings</span></div></div>
        <div class="target" style="left:72px;bottom:88px;width:250px;"><span class="badge">1</span>Settings</div>
        <div class="target" style="right:54px;bottom:154px;width:196px;border-color:var(--accent);background:rgba(92,200,255,.08);box-shadow:none;"><span class="badge" style="background:var(--accent);color:#081018;box-shadow:none;">2</span>Docs</div>
      </div>
    </div>
  </section>
</body>
</html>
